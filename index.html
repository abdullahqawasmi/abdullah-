<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Breakout Arcade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="ui-layer">
            <div class="score-board">Score: <span id="score">0</span></div>
            <button id="restart-btn">Restart Game</button>
        </div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="message-overlay">
            <h1 id="overlay-title">READY?</h1>
            <p>Select your difficulty to start</p>
            <div class="difficulty-selector">
                <button class="diff-btn" data-difficulty="easy">Easy</button>
                <button class="diff-btn" data-difficulty="medium">Medium</button>
                <button class="diff-btn" data-difficulty="hard">Hard</button>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
